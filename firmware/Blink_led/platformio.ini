; ATtiny1616 RS485 Module - Blink_led
; https://docs.platformio.org/page/projectconf.html

[env:ATtiny1616]
platform = atmelmegaavr
board = ATtiny1616
framework = arduino
board_build.mcu = attiny1616
board_build.f_cpu = 20000000L

; --- ATtiny1616 ヒューズビット設定（pio run -t fuses で書き込み） ---
board_fuses.WDTCFG  = 0x00   ; [FUSE0] ウォッチドッグ無効
board_fuses.BODCFG  = 0x00   ; [FUSE1] BOD（電圧低下検出）無効
board_fuses.OSCCFG  = 0x02   ; [FUSE2] 20MHz 内部オシレータ
board_fuses.SYSCFG0 = 0xC4   ; [FUSE4] CRC無効, PA0=UPDI維持, EEPROM消去あり
                              ;         ※ 0xC8(RSTPINCFG=Reset) にすると UPDI 再書き込み不可になるため禁止
board_fuses.SYSCFG1 = 0x06   ; [FUSE5] 起動待機時間 8ms
board_fuses.APPEND  = 0x00   ; [FUSE6] アプリ領域制限なし
board_fuses.BOOTEND = 0x00   ; [FUSE7] ブートセクションなし

upload_protocol = serialupdi
; upload_port = /dev/cu.usbserial-120
upload_speed = 57600
